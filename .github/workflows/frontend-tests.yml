name: Frontend Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 每天凌晨2点运行
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  # 单元测试和集成测试
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Install test dependencies
        working-directory: ./client
        run: npm install --no-save vitest @vitest/coverage-c8 @vitest/ui jsdom

      - name: Run linting
        working-directory: ./client
        run: npm run lint

      - name: Run type checking
        working-directory: ./client
        run: npm run type-check

      - name: Run unit tests
        working-directory: ./client
        run: npm run test:unit -- --reporter=json --outputFile=unit-test-results.json

      - name: Run integration tests
        working-directory: ./client
        run: npm run test:integration -- --reporter=json --outputFile=integration-test-results.json

      - name: Run tests with coverage
        working-directory: ./client
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: ./client/coverage
          files: ./coverage/lcov.info
          flags: frontend
          name: frontend-coverage

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ matrix.node-version }}
          path: |
            client/unit-test-results.json
            client/integration-test-results.json
            client/coverage/

  # E2E测试
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./client
        run: npx playwright install ${{ matrix.browser }}

      - name: Install Playwright dependencies
        working-directory: ./client
        run: npx playwright install-deps

      - name: Setup test database
        run: |
          docker-compose -f docker-compose.test.yml up -d mongodb
          sleep 10
          node client/test/scripts/setup-test-db.js setup

      - name: Start application
        working-directory: ./client
        run: |
          npm run build
          npm run preview &
          sleep 10

      - name: Run E2E tests
        working-directory: ./client
        run: |
          npx playwright test ${{ matrix.browser }} --shard=${{ matrix.shard }}/4

      - name: Upload E2E test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: e2e-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            client/e2e-results/
            client/test-results/

  # 性能测试
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Install Playwright
        working-directory: ./client
        run: npx playwright install chromium

      - name: Build application
        working-directory: ./client
        run: npm run build

      - name: Start application
        working-directory: ./client
        run: npm run preview &

      - name: Run performance tests
        working-directory: ./client
        run: npx playwright test --config=playwright-performance.config.ts
        env:
          BASE_URL: http://localhost:4173

      - name: Upload performance results
        uses: actions/upload-artifact@v3
        with:
          name: performance-results
          path: |
            client/e2e-results/performance-report/
            client/e2e-results/performance-results.json

  # 移动端测试
  mobile-tests:
    name: Mobile Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Install Playwright
        working-directory: ./client
        run: npx playwright install

      - name: Run mobile E2E tests
        working-directory: ./client
        run: npx playwright test --project="Mobile Chrome" --project="Mobile Safari"

      - name: Upload mobile test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: mobile-test-results
          path: |
            client/e2e-results/
            client/test-results/

  # 兼容性测试
  compatibility-tests:
    name: Browser Compatibility Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Run compatibility tests
        working-directory: ./client
        run: npm run test:compatibility

      - name: Upload compatibility results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: compatibility-test-results
          path: client/test-results/

  # 安全测试
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Run npm audit
        working-directory: ./client
        run: npm audit --audit-level moderate

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

  # 测试报告汇总
  test-report:
    name: Test Report Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, performance-tests]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Generate test report
        run: |
          node .github/scripts/generate-test-report.js

      - name: Publish test report
        uses: actions/upload-artifact@v3
        with:
          name: test-report
          path: test-report.html

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs')
            const report = fs.readFileSync('test-results-summary.json', 'utf8')
            const results = JSON.parse(report)

            const comment = `
            ## 🧪 Test Results Summary

            ### Unit & Integration Tests
            - ✅ Passed: ${results.unit.passed}
            - ❌ Failed: ${results.unit.failed}
            - 📊 Coverage: ${results.unit.coverage}%

            ### E2E Tests
            - ✅ Passed: ${results.e2e.passed}
            - ❌ Failed: ${results.e2e.failed}
            - 🌐 Browsers: ${results.e2e.browsers.join(', ')}

            ${results.performance ? `
            ### Performance Tests
            - ⚡ Average Load Time: ${results.performance.avgLoadTime}ms
            - 📊 Performance Score: ${results.performance.score}/100
            ` : ''}

            [View Detailed Report](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})
            `

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            })

  # 部署到测试环境
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Build for staging
        working-directory: ./client
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.STAGING_API_URL }}

      - name: Deploy to staging
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./client/dist
          destination_dir: staging

      - name: Run smoke tests on staging
        run: |
          npm install -g @playwright/test
          npx playwright test --config=e2e/smoke-tests.config.ts
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.repository }}/staging