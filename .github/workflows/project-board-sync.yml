name: Project Board Sync

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [opened, closed, reopened]
  workflow_dispatch:

jobs:
  sync-project-board:
    runs-on: ubuntu-latest
    name: Sync Vibe Kanban Board
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v42
        with:
          files: |
            **/*.vue
            **/*.js
            **/*.ts
            **/*.scss
            **/*.css

      - name: Generate board update
        run: |
          echo "# 📊 Project Board Update" > update.md
          echo "" >> update.md
          echo "**Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> update.md
          echo "**Event**: ${{ github.event_name }}" >> update.md
          echo "**Branch**: ${{ github.ref_name }}" >> update.md
          echo "" >> update.md
          echo "## Changed Files" >> update.md
          echo '```' >> update.md
          echo '${{ steps.changed-files.outputs.all_changed_files }}' >> update.md
          echo '```' >> update.md

      - name: Update project board
        run: |
          echo "Board updated successfully"
          cat update.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('update.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
