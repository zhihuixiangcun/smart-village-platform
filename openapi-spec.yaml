                    type: array
                    items:
                      $ref: '#/components/schemas/SharedResource'

    post:
      tags:
        - 生活服务
      summary: 共享资源
      description: 发布共享资源信息
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedResourceCreate'
      responses:
        '201':
          description: 资源共享成功

  # ==================== 安全审计 ====================
  /api/audit/logs:
    get:
      tags:
        - 安全审计
      summary: 获取审计日志
      description: 获取系统操作审计日志
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
        - name: userId
          in: query
          schema:
            type: string
          description: 用户ID筛选
        - name: action
          in: query
          schema:
            type: string
          description: 操作类型筛选
        - name: level
          in: query
          schema:
            type: string
            enum: [info, warn, error, critical]
          description: 日志级别
      responses:
        '200':
          description: 审计日志列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'

  /api/audit/security-events:
    get:
      tags:
        - 安全审计
      summary: 获取安全事件
      description: 获取系统安全事件记录
      security:
        - bearerAuth: []
      parameters:
        - name: severity
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: status
          in: query
          schema:
            type: string
            enum: [open, investigating, resolved]
      responses:
        '200':
          description: 安全事件列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecurityEvent'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

  schemas:
    # ==================== 通用响应模式 ====================
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 请求是否成功
        message:
          type: string
          description: 响应消息
        data:
          type: object
          description: 响应数据
        timestamp:
          type: string
          format: date-time
          description: 响应时间
      required:
        - success

    Pagination:
      type: object
      properties:
        current:
          type: integer
          description: 当前页码
        pageSize:
          type: integer
          description: 每页大小
        total:
          type: integer
          description: 总记录数
        totalPages:
          type: integer
          description: 总页数

    # ==================== 认证相关 ====================
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        token:
          type: string
          description: JWT访问令牌
        refreshToken:
          type: string
          description: 刷新令牌
        user:
          type: object
          properties:
            id:
              type: string
            username:
              type: string
            name:
              type: string
            role:
              type: string
            village:
              type: string
            permissions:
              type: array
              items:
                type: string
        expiresIn:
          type: integer
          description: 令牌有效期（秒）
      required:
        - success
        - token
        - user

    RegisterResponse:
      type: object
      properties:
        success:
          type: boolean
        user:
          type: object
          properties:
            id:
              type: string
            username:
              type: string
            name:
              type: string
            phone:
              type: string
            villageId:
              type: string
        message:
          type: string

    # ==================== 村委管理 ====================
    CommitteeMember:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: 姓名
        role:
          type: string
          enum: [secretary, director, accountant, security, women, youth]
          description: 职务
        phone:
          type: string
          description: 联系电话（脱敏显示）
        duties:
          type: array
          items:
            type: string
          description: 职责描述
        startDate:
          type: string
          format: date
          description: 任职开始日期
        status:
          type: string
          enum: [active, inactive, historical]
          description: 状态
        certificationDoc:
          type: string
          description: 任命文件URL
        qrCode:
          type: string
          description: 个人联系二维码

    CommitteeMemberCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 20
        role:
          type: string
          enum: [secretary, director, accountant, security, women, youth]
        phone:
          type: string
          pattern: '^1[3-9]\d{9}$'
        idCard:
          type: string
          pattern: '^[1-9]\d{5}(18|19|20)\d{2}((0[1-9])|(1[0-2]))(([0-2][1-9])|10|20|30|31)\d{3}[0-9Xx]$'
        duties:
          type: array
          items:
            type: string
        certificationDoc:
          type: string
          description: 任命文件
      required:
        - name
        - role
        - phone
        - idCard

    DutySchedule:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        timeSlot:
          type: string
          enum: [morning, afternoon, night, all_day]
        member:
          $ref: '#/components/schemas/CommitteeMember'
        qrCode:
          type: string
          description: 值班二维码URL
        emergencyContact:
          type: string
          description: 紧急联系方式
        location:
          type: string
          description: 值班地点

    DutyScheduleCreate:
      type: object
      properties:
        memberId:
          type: string
        date:
          type: string
          format: date
        timeSlot:
          type: string
          enum: [morning, afternoon, night, all_day]
        location:
          type: string
        notes:
          type: string
      required:
        - memberId
        - date
        - timeSlot

    # ==================== 村民管理 ====================
    ResidentProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: 姓名
        phone:
          type: string
          description: 联系电话（脱敏）
        idCard:
          type: string
          description: 身份证号（脱敏）
        address:
          type: string
        familyType:
          type: string
          enum: [normal, poverty, single, disabled, veteran]
        householdSize:
          type: integer
        registrationDate:
          type: string
          format: date
        lastUpdated:
          type: string
          format: date-time
        qrCode:
          type: string
          description: 一户一码

    ResidentDetail:
      allOf:
        - $ref: '#/components/schemas/ResidentProfile'
        - type: object
          properties:
            fullIdCard:
              type: string
              description: 完整身份证号（需权限）
            fullPhone:
              type: string
              description: 完整手机号（需权限）
            familyMembers:
              type: array
              items:
                $ref: '#/components/schemas/FamilyMember'
            healthStatus:
              type: object
              properties:
                chronicDisease:
                  type: array
                  items:
                    type: string
                vaccinationStatus:
                  type: string
                medicalInsurance:
                  type: boolean
            economicStatus:
              type: object
              properties:
                income:
                  type: string
                  enum: [poverty, low, medium, high]
                subsidies:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      amount:
                        type: number
                      startDate:
                        type: string
                        format: date

    ResidentCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 20
        phone:
          type: string
          pattern: '^1[3-9]\d{9}$'
        idCard:
          type: string
        address:
          type: string
        familyType:
          type: string
          enum: [normal, poverty, single, disabled, veteran]
        familyMembers:
          type: array
          items:
            $ref: '#/components/schemas/FamilyMemberCreate'
      required:
        - name
        - phone
        - idCard
        - address

    ResidentUpdate:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        address:
          type: string
        familyType:
          type: string
        emergencyContact:
          type: string
        notes:
          type: string

    FamilyMember:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        relationship:
          type: string
          enum: [spouse, parent, child, sibling, grandparent, grandchild, other]
        age:
          type: integer
        idCard:
          type: string
        phone:
          type: string
        occupation:
          type: string

    FamilyMemberCreate:
      type: object
      properties:
        name:
          type: string
        relationship:
          type: string
          enum: [spouse, parent, child, sibling, grandparent, grandchild, other]
        age:
          type: integer
        idCard:
          type: string
        phone:
          type: string
        occupation:
          type: string
      required:
        - name
        - relationship
        - age

    # ==================== 村务治理 ====================
    FinanceRecord:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [income, expense]
        amount:
          type: number
        category:
          type: string
        description:
          type: string
        date:
          type: string
          format: date
        vendor:
          type: string
        receiptUrl:
          type: string
        approver:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time

    FinanceRecordCreate:
      type: object
      properties:
        type:
          type: string
          enum: [income, expense]
        amount:
          type: number
          minimum: 0.01
        category:
          type: string
        description:
          type: string
        date:
          type: string
          format: date
        vendor:
          type: string
        receiptImage:
          type: string
          format: binary
          description: 票据图片
        ocrData:
          type: object
          description: OCR识别数据
      required:
        - type
        - amount
        - category
        - description
        - date

    FinanceSummary:
      type: object
      properties:
        totalIncome:
          type: number
        totalExpense:
          type: number
        balance:
          type: number
        categoryBreakdown:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              amount:
                type: number
              percentage:
                type: number

    VillageProject:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        budget:
          type: number
        status:
          type: string
          enum: [planning, approved, executing, completed, suspended]
        progress:
          type: number
          minimum: 0
          maximum: 100
        startDate:
          type: string
          format: date
        expectedEndDate:
          type: string
          format: date
        actualEndDate:
          type: string
          format: date
        manager:
          type: string
        milestones:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              date:
                type: string
                format: date
              status:
                type: string
                enum: [pending, completed, overdue]
        risks:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              description:
                type: string
              severity:
                type: string
              mitigationPlan:
                type: string

    VillageProjectCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 5
          maxLength: 100
        description:
          type: string
        category:
          type: string
        budget:
          type: number
          minimum: 0
        expectedDuration:
          type: integer
          description: 预期工期（天）
        managerId:
          type: string
        milestones:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              plannedDate:
                type: string
                format: date
      required:
        - name
        - description
        - category
        - budget
        - managerId

    # ==================== 信息公示 ====================
    Announcement:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        category:
          type: string
          enum: [policy, notice, activity, emergency]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        publishDate:
          type: string
          format: date-time
        expiryDate:
          type: string
          format: date-time
        author:
          type: string
        attachments:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              url:
                type: string
              size:
                type: integer
        views:
          type: integer
        tags:
          type: array
          items:
            type: string
        isTop:
          type: boolean
          description: 是否置顶

    AnnouncementDetail:
      allOf:
        - $ref: '#/components/schemas/Announcement'
        - type: object
          properties:
            relatedPolicies:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
            comments:
              type: array
              items:
                $ref: '#/components/schemas/Comment'
            readStatus:
              type: boolean
              description: 当前用户是否已读

    AnnouncementCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 200
        content:
          type: string
          minLength: 10
        category:
          type: string
          enum: [policy, notice, activity, emergency]
        priority:
          type: string
          enum: [low, normal, high, urgent]
          default: normal
        expiryDate:
          type: string
          format: date-time
        attachments:
          type: array
          items:
            type: string
            description: 附件文件路径
        tags:
          type: array
          items:
            type: string
        isTop:
          type: boolean
          default: false
        targetAudience:
          type: array
          items:
            type: string
            enum: [all, committee, residents, elderly, youth]
      required:
        - title
        - content
