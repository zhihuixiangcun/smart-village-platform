            type: string
            enum: [water_pump, farm_equipment, tools, others]
          description: 资源类型
        - name: available
          in: query
          schema:
            type: boolean
            default: true
          description: 是否可用
      responses:
        '200':
          description: 资源列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
