          description: 系统异常

  /monitoring:
    get:
      tags:
        - 监控系统
      summary: 监控面板
      description: 系统监控面板首页
      responses:
        '200':
          description: 监控面板HTML页面
          content:
            text/html:
              schema:
                type: string

  /api/monitoring/health:
    get:
      tags:
        - 监控系统
      summary: 监控健康状态
      description: 获取详细的系统监控健康状态
      responses:
        '200':
          description: 监控系统状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringHealth'

  /api/monitoring/data:
    get:
      tags:
        - 监控系统
      summary: 监控数据
      description: 获取实时系统监控数据
      parameters:
        - name: timeRange
          in: query
          schema:
            type: string
            enum: [1h, 6h, 24h, 7d]
            default: 1h
          description: 数据时间范围
        - name: metrics
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [cpu, memory, disk, network, api_requests]
          description: 指定监控指标
      responses:
        '200':
          description: 监控数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringData'

  /api/monitoring/status:
    get:
      tags:
        - 监控系统
      summary: 监控状态概览
      description: 获取监控系统状态概览
      responses:
        '200':
          description: 状态概览
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringStatus'

  # ==================== 生活服务 ====================
  /api/services/village-mall:
    get:
      tags:
        - 生活服务
      summary: 乡村商城
      description: 获取乡村电商商品列表，对接助农专区
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [produce, handicraft, speciality, daily]
          description: 商品类别
        - name: location
          in: query
          schema:
            type: string
          description: 地理位置筛选
      responses:
        '200':
          description: 商品列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MallProduct'

  /api/services/carpooling:
    get:
      tags:
        - 生活服务
      summary: 乡村拼车
      description: 获取拼车信息列表
      parameters:
        - name: origin
          in: query
          schema:
            type: string
          description: 出发地
        - name: destination
          in: query
          schema:
            type: string
          description: 目的地
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: 出行日期
      responses:
        '200':
          description: 拼车列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
