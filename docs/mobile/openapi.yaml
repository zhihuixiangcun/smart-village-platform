        approvedAmount:
          type: number
          description: 审批金额
        reviewDate:
          type: string
          format: date-time
        reviewer:
          type: string
          description: 审批人
        remarks:
          type: string
        createdAt:
          type: string
          format: date-time

    WelfareApplicationRequest:
