      required:
        - welfareType
        - applicant
      properties:
        welfareType:
          type: string
          enum: [subsistence, disability, elderly, one_child, education, medical]
        applicant:
          type: object
          required:
            - name
            - idCard
            - phone
            - householdNumber
          properties:
            name:
              type: string
            idCard:
              type: string
            phone:
              type: string
            householdNumber:
              type: string
        householdInfo:
          type: object
          properties:
            members:
              type: integer
            income:
              type: number
            assets:
              type: object
        reason:
          type: string
          maxLength: 1000
        supportingDocuments:
          type: array
          items:
