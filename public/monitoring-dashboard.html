<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧乡村平台 - 实时监控仪表板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@2.29.3/index.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }

        .dashboard {
            padding: 20px;
            max-width: 1920px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .connection-status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .connected {
            background: #4CAF50;
            color: white;
        }

        .disconnected {
            background: #f44336;
            color: white;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .metric-title {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .metric-change {
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .metric-change.positive {
            color: #4CAF50;
        }

        .metric-change.negative {
            color: #f44336;
        }

        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .chart-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #333;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .alerts-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 20px;
        }

        .alerts-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #333;
        }

        .alert-item {
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .alert-item.info {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
        }

        .alert-item.warning {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
        }

        .alert-item.critical {
            background: #ffebee;
            border-left: 4px solid #f44336;
        }

        .alert-item.emergency {
            background: #fce4ec;
            border-left: 4px solid #e91e63;
        }

        .alert-time {
            font-size: 0.8rem;
            color: #666;
        }

        .top-routes {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .route-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .route-name {
            font-family: monospace;
            font-size: 0.9rem;
        }

        .route-stats {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
        }

        .route-time {
            color: #666;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-good {
            background: #4CAF50;
        }

        .status-warning {
            background: #ff9800;
        }

        .status-critical {
            background: #f44336;
        }

        @media (max-width: 768px) {
            .dashboard {
                padding: 10px;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .charts-container {
                grid-template-columns: 1fr;
            }
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            color: white;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>智慧乡村平台 - 实时监控仪表板</h1>
            <div id="connectionStatus" class="connection-status disconnected">
                <span class="status-indicator"></span>
                连接中...
            </div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-title">总请求数</div>
                <div class="metric-value" id="totalRequests">-</div>
                <div class="metric-change" id="requestsChange">-</div>
                <div class="chart-container">
                    <canvas id="requestsChart"></canvas>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-title">平均响应时间</div>
                <div class="metric-value" id="avgResponseTime">-</div>
                <div class="metric-change" id="responseTimeChange">-</div>
                <div class="chart-container">
                    <canvas id="responseTimeChart"></canvas>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-title">QPS</div>
                <div class="metric-value" id="qps">-</div>
                <div class="metric-change" id="qpsChange">-</div>
                <div class="chart-container">
                    <canvas id="qpsChart"></canvas>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-title">错误率</div>
                <div class="metric-value" id="errorRate">-</div>
                <div class="metric-change" id="errorRateChange">-</div>
                <div class="chart-container">
                    <canvas id="errorRateChart"></canvas>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-title">内存使用</div>
                <div class="metric-value" id="memoryUsage">-</div>
                <div class="metric-change" id="memoryChange">-</div>
                <div class="chart-container">
                    <canvas id="memoryChart"></canvas>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-title">CPU使用率</div>
                <div class="metric-value" id="cpuUsage">-</div>
                <div class="metric-change" id="cpuChange">-</div>
                <div class="chart-container">
                    <canvas id="cpuChart"></canvas>
                </div>
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-card">
                <div class="chart-title">响应时间趋势</div>
                <div class="chart-container">
                    <canvas id="responseTimeTrendChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <div class="chart-title">请求量趋势</div>
                <div class="chart-container">
                    <canvas id="requestsTrendChart"></canvas>
                </div>
            </div>
        </div>

        <div class="alerts-section">
            <div class="alerts-title">实时告警</div>
            <div id="alertsContainer">
                <div class="loading">加载中...</div>
            </div>
        </div>

        <div class="top-routes">
            <div class="alerts-title">热门路由</div>
            <div id="topRoutesContainer">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        class MonitoringDashboard {
            constructor() {
                this.ws = null;
                this.reconnectAttempts = 0;
                this.maxReconnectAttempts = 5;
                this.charts = {};
                this.data = {
                    metrics: {},
                    history: {
                        timestamps: [],
                        responseTimes: [],
                        requests: []
                    },
                    alerts: [],
                    routes: []
                };

                this.init();
            }

            init() {
                this.initWebSocket();
                this.initCharts();
                this.startPeriodicUpdates();
            }

            initWebSocket() {
                const wsUrl = `ws://${window.location.hostname}:3002`;

                try {
                    this.ws = new WebSocket(wsUrl);

                    this.ws.onopen = () => {
                        console.log('WebSocket连接已建立');
                        this.updateConnectionStatus(true);
                        this.reconnectAttempts = 0;

                        // 订阅监控数据
                        this.send({
                            type: 'subscribe',
                            channels: ['metrics', 'routes', 'system', 'alerts']
                        });
                    };

                    this.ws.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            this.handleWebSocketMessage(data);
                        } catch (error) {
                            console.error('解析WebSocket消息失败:', error);
                        }
                    };

                    this.ws.onclose = () => {
                        console.log('WebSocket连接已关闭');
                        this.updateConnectionStatus(false);
                        this.attemptReconnect();
                    };

                    this.ws.onerror = (error) => {
                        console.error('WebSocket错误:', error);
                        this.updateConnectionStatus(false);
                    };
                } catch (error) {
                    console.error('创建WebSocket连接失败:', error);
                    this.updateConnectionStatus(false);
                }
            }

            handleWebSocketMessage(data) {
                switch (data.type) {
                    case 'initial':
                        this.handleInitialData(data.data);
                        break;
                    case 'metrics':
                        this.handleMetricsUpdate(data.data);
                        break;
                    case 'alert':
                        this.handleAlert(data.data);
                        break;
                    case 'subscribed':
                        console.log('订阅成功:', data.channels);
                        break;
                    default:
                        console.log('未知消息类型:', data.type);
                }
            }

            handleInitialData(data) {
                if (data.currentMetrics) {
                    this.updateMetrics(data.currentMetrics);
                }
                if (data.statistics) {
                    this.updateStatistics(data.statistics);
                }
                if (data.history) {
                    this.updateHistory(data.history);
                }
            }

            handleMetricsUpdate(data) {
                if (data.current) {
                    this.updateMetrics(data.current);
                }
                if (data.statistics) {
                    this.updateStatistics(data.statistics);
                }
                if (data.alerts) {
                    this.updateAlerts(data.alerts);
                }
            }

            handleAlert(alert) {
                this.data.alerts.unshift(alert);
                if (this.data.alerts.length > 10) {
                    this.data.alerts.pop();
                }
                this.updateAlertsDisplay();
            }

            updateMetrics(metrics) {
                this.data.metrics = metrics;

                // 更新系统指标
                if (metrics.system) {
                    this.updateSystemMetrics(metrics.system);
                }

                // 更新路由统计
                if (metrics.routes) {
                    this.updateRoutesDisplay(metrics.routes);
                }

                // 更新历史数据
                this.updateHistoryData(metrics);
            }

            updateStatistics(stats) {
                // 更新关键指标卡片
                this.updateMetricCard('totalRequests', stats.totalRequests);
                this.updateMetricCard('avgResponseTime', stats.avgResponseTime, 'ms');
                this.updateMetricCard('qps', stats.requestsPerSecond);
                this.updateMetricCard('errorRate', (stats.errorRate * 100).toFixed(2), '%');

                // 更新趋势图表
                this.updateTrendCharts(stats);
            }

            updateSystemMetrics(system) {
                const memoryMB = system.memoryUsed.toFixed(2);
                const memoryPercent = ((system.memoryUsed / system.memoryTotal) * 100).toFixed(1);

                this.updateMetricCard('memoryUsage', `${memoryMB}MB`, `(${memoryPercent}%)`);
                this.updateMetricCard('cpuUsage', `${system.cpu.toFixed(1)}%`);
            }

            updateMetricCard(id, value, suffix = '') {
                const element = document.getElementById(id);
                if (element) {
                    element.textContent = value + suffix;
                }
            }

            updateHistoryData(metrics) {
                const now = new Date();
                this.data.history.timestamps.push(now);

                if (metrics.system) {
                    this.data.history.responseTimes.push(metrics.system.avgResponseTime || 0);
                    this.data.history.requests.push(metrics.system.totalRequests || 0);
                }

                // 保持最近50个数据点
                if (this.data.history.timestamps.length > 50) {
                    this.data.history.timestamps.shift();
                    this.data.history.responseTimes.shift();
                    this.data.history.requests.shift();
                }

                this.updateRealtimeCharts();
            }

            updateAlerts(alerts) {
                this.data.alerts = alerts;
                this.updateAlertsDisplay();
            }

            updateAlertsDisplay() {
                const container = document.getElementById('alertsContainer');

                if (!this.data.alerts || this.data.alerts.length === 0) {
                    container.innerHTML = '<div class="loading">暂无告警</div>';
                    return;
                }

                const alertsHTML = this.data.alerts.slice(0, 5).map(alert => `
                    <div class="alert-item ${alert.level}">
                        <div>
                            <strong>${alert.message}</strong>
                            <div style="font-size: 0.9rem; margin-top: 5px;">${alert.value} (阈值: ${alert.threshold})</div>
                        </div>
                        <div class="alert-time">${this.formatTime(new Date(alert.timestamp))}</div>
                    </div>
                `).join('');

                container.innerHTML = alertsHTML;
            }

            updateRoutesDisplay(routes) {
                const container = document.getElementById('topRoutesContainer');

                if (!routes || Object.keys(routes).length === 0) {
                    container.innerHTML = '<div class="loading">暂无路由数据</div>';
                    return;
                }

                const sortedRoutes = Object.entries(routes)
                    .sort(([,a], [,b]) => b.count - a.count)
                    .slice(0, 10);

                const routesHTML = sortedRoutes.map(([route, stats]) => {
                    const statusClass = stats.avgResponseTime > 500 ? 'critical' :
                                     stats.avgResponseTime > 200 ? 'warning' : 'good';

                    return `
                        <div class="route-item">
                            <div class="route-name">${route}</div>
                            <div class="route-stats">
                                <span>请求数: ${stats.count}</span>
                                <span class="route-time">${stats.avgResponseTime.toFixed(2)}ms</span>
                                <span class="status-indicator ${statusClass}"></span>
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = routesHTML;
            }

            updateConnectionStatus(connected) {
                const statusElement = document.getElementById('connectionStatus');
                const indicator = statusElement.querySelector('.status-indicator');

                if (connected) {
                    statusElement.className = 'connection-status connected';
                    statusElement.textContent = '已连接';
                    indicator.className = 'status-indicator status-good';
                } else {
                    statusElement.className = 'connection-status disconnected';
                    statusElement.textContent = '连接断开';
                    indicator.className = 'status-indicator status-critical';
                }
            }

            attemptReconnect() {
                if (this.reconnectAttempts < this.maxReconnectAttempts) {
                    this.reconnectAttempts++;
                    console.log(`尝试重连 (${this.reconnectAttempts}/${this.maxReconnectAttempts})...`);

                    setTimeout(() => {
                        this.initWebSocket();
                    }, 5000 * this.reconnectAttempts);
                } else {
                    console.error('重连失败，请刷新页面');
                }
            }

            send(data) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify(data));
                }
            }

            initCharts() {
                const chartOptions = {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            display: true
                        },
                        y: {
                            display: true
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                };

                // 响应时间趋势图
                this.charts.responseTimeTrend = new Chart(
                    document.getElementById('responseTimeTrendChart'),
                    {
                        type: 'line',
                        data: {
                            labels: [],
                            datasets: [{
                                label: '响应时间',
                                data: [],
                                borderColor: 'rgb(75, 192, 192)',
                                tension: 0.1,
                                fill: false
                            }]
                        },
                        options: chartOptions
                    }
                );

                // 请求量趋势图
                this.charts.requestsTrend = new Chart(
                    document.getElementById('requestsTrendChart'),
                    {
                        type: 'line',
                        data: {
                            labels: [],
                            datasets: [{
                                label: '请求数',
                                data: [],
                                borderColor: 'rgb(255, 99, 132)',
                                tension: 0.1,
                                fill: false
                            }]
                        },
                        options: chartOptions
                    }
                );
            }

            updateRealtimeCharts() {
                const labels = this.data.history.timestamps.map(t =>
                    this.formatTime(t, true)
                );

                // 更新响应时间趋势图
                this.charts.responseTimeTrend.data.labels = labels;
                this.charts.responseTimeTrend.data.datasets[0].data = this.data.history.responseTimes;
                this.charts.responseTimeTrend.update('none');

                // 更新请求量趋势图
                this.charts.requestsTrend.data.labels = labels;
                this.charts.requestsTrend.data.datasets[0].data = this.data.history.requests;
                this.charts.requestsTrend.update('none');
            }

            updateTrendCharts(stats) {
                // 更新迷你图表
                if (this.charts.requestsMini) {
                    // 添加新数据点并更新
                }
            }

            startPeriodicUpdates() {
                setInterval(() => {
                    // 请求最新数据
                    this.send({
                        type: 'getMetrics'
                    });
                }, 5000);
            }

            formatTime(date, short = false) {
                if (short) {
                    return date.toLocaleTimeString('zh-CN', {
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                }

                return date.toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            }
        }

        // 初始化监控仪表板
        document.addEventListener('DOMContentLoaded', () => {
            const dashboard = new MonitoringDashboard();
        });
    </script>
</body>
</html>
