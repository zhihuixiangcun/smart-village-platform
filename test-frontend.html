<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>前后端连接测试</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .title {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
      font-weight: bold;
    }
    .test-section {
      margin-bottom: 30px;
      padding: 20px;
      border: 2px solid #e1e5e9;
      border-radius: 8px;
      background: #f8f9fa;
    }
    .test-title {
      font-size: 18px;
      font-weight: bold;
      color: #495057;
      margin-bottom: 15px;
    }
    .btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin-right: 10px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .btn:hover {
      background: #0056b3;
    }
    .btn.success {
      background: #28a745;
    }
    .btn.error {
      background: #dc3545;
    }
    .result {
      margin-top: 15px;
      padding: 15px;
      border-radius: 5px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
    .result.success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }
    .result.error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .form-group input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    .status {
      text-align: center;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .status.online {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status.offline {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">🔗 前后端连接测试</h1>

    <div id="status" class="status offline">
      🔄 正在检测服务器状态...
    </div>

    <!-- 基础连接测试 -->
    <div class="test-section">
      <div class="test-title">1. 基础连接测试</div>
      <button class="btn" onclick="testConnection()">测试连接</button>
      <button class="btn" onclick="testHealth()">健康检查</button>
      <div id="connection-result" class="result" style="display:none;"></div>
    </div>

    <!-- 登录测试 -->
    <div class="test-section">
      <div class="test-title">2. 登录认证测试</div>
      <div class="form-group">
        <label>用户名:</label>
        <input type="text" id="username" value="admin" placeholder="请输入用户名">
      </div>
      <div class="form-group">
        <label>密码:</label>
        <input type="password" id="password" value="admin123" placeholder="请输入密码">
      </div>
      <button class="btn" onclick="testLogin()">登录测试</button>
      <button class="btn" onclick="testUserInfo()" id="userInfoBtn" disabled>获取用户信息</button>
      <div id="login-result" class="result" style="display:none;"></div>
    </div>

    <!-- API数据测试 -->
    <div class="test-section">
      <div class="test-title">3. 业务API测试</div>
      <button class="btn" onclick="testResidents()">获取村民列表</button>
      <button class="btn" onclick="testCommittee()">获取村委信息</button>
      <div id="api-result" class="result" style="display:none;"></div>
    </div>

    <!-- Vue状态管理测试 -->
    <div class="test-section">
      <div class="test-title">4. Vue状态管理测试</div>
      <button class="btn" onclick="testVueStore()">测试Pinia Store</button>
      <div id="vue-result" class="result" style="display:none;"></div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3001';
    let authToken = null;

    // 页面加载时自动检测服务器状态
    window.onload = function() {
      checkServerStatus();
    };

    // 检测服务器状态
    async function checkServerStatus() {
      try {
        const response = await fetch(`${API_BASE}/health`);
        if (response.ok) {
          document.getElementById('status').className = 'status online';
          document.getElementById('status').innerHTML = '✅ 后端服务器在线 (localhost:3001)';
        } else {
          throw new Error('服务器响应异常');
        }
      } catch (error) {
        document.getElementById('status').className = 'status offline';
        document.getElementById('status').innerHTML = '❌ 后端服务器离线或不可访问';
      }
    }

    // 显示结果
    function showResult(elementId, data, isSuccess = true) {
      const element = document.getElementById(elementId);
      element.style.display = 'block';
      element.className = `result ${isSuccess ? 'success' : 'error'}`;
      element.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    }

    // 测试基础连接
    async function testConnection() {
      try {
        const response = await fetch(`${API_BASE}/api/test`);
        const data = await response.json();
        showResult('connection-result', data);
      } catch (error) {
        showResult('connection-result', `连接失败: ${error.message}`, false);
      }
    }

    // 测试健康检查
    async function testHealth() {
      try {
        const response = await fetch(`${API_BASE}/health`);
        const data = await response.json();
        showResult('connection-result', data);
      } catch (error) {
        showResult('connection-result', `健康检查失败: ${error.message}`, false);
      }
    }

    // 测试登录
    async function testLogin() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          authToken = data.token;
          document.getElementById('userInfoBtn').disabled = false;
          showResult('login-result', data);
        } else {
          showResult('login-result', data, false);
        }
      } catch (error) {
        showResult('login-result', `登录失败: ${error.message}`, false);
      }
    }

    // 测试获取用户信息
    async function testUserInfo() {
      if (!authToken) {
        showResult('login-result', '请先登录获取Token', false);
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/auth/userinfo`, {
          headers: {
            'Authorization': `Bearer ${authToken}`
          }
        });

        const data = await response.json();
        showResult('login-result', data, response.ok);
      } catch (error) {
        showResult('login-result', `获取用户信息失败: ${error.message}`, false);
      }
    }

    // 测试村民API
    async function testResidents() {
      try {
        const response = await fetch(`${API_BASE}/api/residents`);
        const data = await response.json();
        showResult('api-result', data);
      } catch (error) {
        showResult('api-result', `获取村民列表失败: ${error.message}`, false);
      }
    }

    // 测试村委API
    async function testCommittee() {
      try {
        const response = await fetch(`${API_BASE}/api/committee/members`);
        const data = await response.json();
        showResult('api-result', data);
      } catch (error) {
        showResult('api-result', `获取村委信息失败: ${error.message}`, false);
      }
    }

    // 测试Vue Store（模拟）
    async function testVueStore() {
      try {
        // 模拟Pinia Store的行为
        const mockStore = {
          state: {
            user: null,
            token: authToken,
            residents: [],
            committee: []
          },
          actions: {
            async login(credentials) {
              const response = await fetch(`${API_BASE}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(credentials)
              });
              return response.json();
            },
            async getResidents() {
              const response = await fetch(`${API_BASE}/api/residents`);
              return response.json();
            }
          }
        };

        // 测试Store功能
        const testResults = {
          storeInitialized: !!mockStore,
          hasAuthToken: !!mockStore.state.token,
          actionsAvailable: Object.keys(mockStore.actions),
          stateKeys: Object.keys(mockStore.state)
        };

        // 如果有token，测试数据获取
        if (mockStore.state.token) {
          try {
            const residentsData = await mockStore.actions.getResidents();
            testResults.residentsTest = {
              success: true,
              dataCount: residentsData.data?.length || 0
            };
          } catch (error) {
            testResults.residentsTest = {
              success: false,
              error: error.message
            };
          }
        }

        showResult('vue-result', {
          message: 'Vue状态管理测试完成',
          results: testResults
        });
      } catch (error) {
        showResult('vue-result', `Vue Store测试失败: ${error.message}`, false);
      }
    }

    // 定期检查服务器状态
    setInterval(checkServerStatus, 30000); // 30秒检查一次
  </script>
</body>
</html>
