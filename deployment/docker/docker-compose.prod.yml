# 智慧乡村平台 - 生产环境Docker Compose配置
version: '3.8'

services:
  # 前端服务
  frontend:
    build:
      context: ../../client
      dockerfile: Dockerfile.prod
    container_name: smart-village-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=https://api.smartvillage.com
      - VITE_WS_URL=wss://api.smartvillage.com
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - frontend_logs:/var/log/nginx
    depends_on:
      - gateway
    networks:
      - smart-village-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API网关服务
  gateway:
    build:
      context: ../../gateway
      dockerfile: Dockerfile.prod
    container_name: smart-village-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - GATEWAY_PORT=8080
      - AUTH_SERVICE_URL=http://auth-service:3001
      - VILLAGE_SERVICE_URL=http://village-service:5000
      - MONITORING_SERVICE_URL=http://monitoring-service:3099
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=https://smartvillage.com
    volumes:
      - gateway_logs:/app/logs
    depends_on:
      - redis
      - auth-service
      - village-service
      - monitoring-service
    networks:
      - smart-village-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 认证服务
  auth-service:
    build:
      context: ../../src
      dockerfile: Dockerfile.prod
      target: auth-service
    container_name: smart-village-auth
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - BCRYPT_ROUNDS=12
    volumes:
      - auth_logs:/app/logs
    depends_on:
      - mongodb
      - redis
    networks:
      - smart-village-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 村务服务
  village-service:
    build:
      context: ../../src
      dockerfile: Dockerfile.prod
      target: village-service
    container_name: smart-village-village
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - UPLOAD_PATH=/app/uploads
      - SOCKET_IO_CORS_ORIGIN=https://smartvillage.com
    volumes:
      - village_uploads:/app/uploads
      - village_logs:/app/logs
    depends_on:
      - mongodb
      - redis
    networks:
      - smart-village-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 监控服务
  monitoring-service:
    build:
      context: ../../src
      dockerfile: Dockerfile.prod
      target: monitoring-service
    container_name: smart-village-monitoring
    restart: unless-stopped
    ports:
      - "3099:3099"
    environment:
      - NODE_ENV=production
      - MONITORING_PORT=3099
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=${MONGODB_URI}
    volumes:
      - monitoring_logs:/app/logs
      - monitoring_backups:/app/backups
    depends_on:
      - mongodb
      - redis
    networks:
      - smart-village-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3099/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MongoDB数据库
  mongodb:
    image: mongo:7.0
    container_name: smart-village-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=smart-village
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
    command: mongod --auth --bind_ip_all --keyFile /etc/mongodb-keyfile
    networks:
      - smart-village-network
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.runCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis缓存
  redis:
    image: redis:7.2-alpine
    container_name: smart-village-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    networks:
      - smart-village-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx负载均衡器
  nginx:
    image: nginx:1.25-alpine
    container_name: smart-village-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - gateway
    networks:
      - smart-village-network

  # Prometheus监控
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: smart-village-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - smart-village-network

  # Grafana可视化
  grafana:
    image: grafana/grafana:10.0.0
    container_name: smart-village-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - smart-village-network

  # ELK日志系统 (可选)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: smart-village-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - smart-village-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.8.0
    container_name: smart-village-logstash
    restart: unless-stopped
    environment:
      - "LS_JAVA_OPTS=-Xmx256m -Xms256m"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - logstash_logs:/usr/share/logstash/logs
    depends_on:
      - elasticsearch
    networks:
      - smart-village-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    container_name: smart-village-kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - smart-village-network

# 数据卷定义
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  frontend_logs:
    driver: local
  gateway_logs:
    driver: local
  auth_logs:
    driver: local
  village_logs:
    driver: local
  monitoring_logs:
    driver: local
  monitoring_backups:
    driver: local
  village_uploads:
    driver: local
  nginx_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local
  logstash_logs:
    driver: local

# 网络定义
networks:
  smart-village-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16