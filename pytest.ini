# Pytest 配置文件
# 测试框架配置

# 测试路径
testpaths = [
    "tests",
    "python-voice-service/tests",
    "services/agriculture-service/tests"
]

# Python 文件匹配模式
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# 覆盖率配置
[tool:pytest]
addopts =
    --strict-markers
    --strict-config
    --verbose
    --cov-report=term
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-report=json
    --cov-fail-under=80

# 覆盖率目标
cov_fail_under = 80

# 覆盖率包含/排除的文件
cov_source = [
    ".",
    "python-voice-service",
    "services/agriculture-service"
]

cov_ignore =
    */tests/*
    */test_*.py
    */__init__.py
    */migrations/*
    */venv/*
    */env/*
    */node_modules/*

# 标记定义
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
    redis: Tests requiring Redis
    external: Tests requiring external services
    requires_auth: Tests requiring authentication

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 测试输出
testmon_on = true
testmon_recording = --testmon
testmon_verbose_level = 2

# 超时配置
timeout = 300
timeout_method = thread

# 钩子
asyncio_mode = auto

# 最小版本
minversion = 7.0
