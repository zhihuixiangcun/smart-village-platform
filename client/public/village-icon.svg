<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 背景圆形 -->
  <circle cx="50" cy="50" r="48" fill="url(#gradient)" stroke="#ffffff" stroke-width="2"/>

  <!-- 房屋图标 -->
  <path d="M30 45 L50 25 L70 45 L70 70 L60 70 L60 55 L40 55 L40 70 L30 70 Z" fill="#ffffff"/>

  <!-- 门 -->
  <rect x="43" y="55" width="14" height="15" fill="#667eea" rx="2"/>

  <!-- 窗户 -->
  <rect x="35" y="30" width="8" height="8" fill="#667eea" rx="1"/>
  <rect x="57" y="30" width="8" height="8" fill="#667eea" rx="1"/>
  <rect x="35" y="42" width="8" height="8" fill="#667eea" rx="1"/>
  <rect x="57" y="42" width="8" height="8" fill="#667eea" rx="1"/>

  <!-- 装饰线条 -->
  <path d="M25 35 L25 30 L75 30 L75 35" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>