global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@smartvillage.com'
  smtp_auth_username: 'alerts@smartvillage.com'
  smtp_auth_password: 'your-email-password'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 5s
      repeat_interval: 5m
      continue: true

    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 2h
      continue: true

    - match:
        severity: info
      receiver: 'info-alerts'
      group_wait: 60s
      repeat_interval: 24h

    - match:
        alertname: EmergencyBroadcastActive
      receiver: 'emergency-alerts'
      group_wait: 0s
      repeat_interval: 1m

    - match:
        service: smart-village-api
      receiver: 'dev-team'
      continue: true

    - match:
        service: smart-village-village
      receiver: 'ops-team'
      continue: true

receivers:
  - name: 'default'
    email_configs:
      - to: 'admin@smartvillage.com'
        subject: '[Smart Village] {{ .GroupLabels.alertname }} Alert'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
          {{ end }}
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#alerts'
        title: 'Smart Village Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

  - name: 'critical-alerts'
    email_configs:
      - to: 'oncall@smartvillage.com,admin@smartvillage.com'
        subject: '[CRITICAL] Smart Village Production Alert'
        body: |
          CRITICAL ALERT - Immediate attention required!

          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt }}
          {{ end }}
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#critical'
        title: '🚨 CRITICAL ALERT'
        color: 'danger'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Service:* {{ .Labels.service }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}
    webhook_configs:
      - url: 'http://alertmanager-webhook:5000/critical'
        send_resolved: true

  - name: 'warning-alerts'
    email_configs:
      - to: 'dev-team@smartvillage.com'
        subject: '[WARNING] Smart Village Alert'
        body: |
          Warning alert - Please investigate:

          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          {{ end }}
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#warnings'
        title: '⚠️ Warning Alert'
        color: 'warning'

  - name: 'info-alerts'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#info'
        title: 'ℹ️ Info Alert'
        color: 'good'

  - name: 'emergency-alerts'
    email_configs:
      - to: 'emergency@smartvillage.com,admin@smartvillage.com'
        subject: '[EMERGENCY] Smart Village Emergency Broadcast'
        body: |
          EMERGENCY BROADCAST ACTIVE

          Immediate action required!
          Time: {{ .Alerts.Firing.StartsAt }}

          {{ range .Alerts }}
          {{ .Annotations.description }}
          {{ end }}
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#emergency'
        title: '🚨 EMERGENCY BROADCAST'
        color: '#ff0000'
    webhook_configs:
      - url: 'http://emergency-service:8080/broadcast'
        send_resolved: true

  - name: 'dev-team'
    email_configs:
      - to: 'dev-team@smartvillage.com'
        subject: '[Dev Alert] {{ .GroupLabels.alertname }}'
        body: |
          Development team alert:
          {{ range .Alerts }}
          {{ .Annotations.summary }} - {{ .Annotations.description }}
          {{ end }}

  - name: 'ops-team'
    email_configs:
      - to: 'ops-team@smartvillage.com'
        subject: '[Ops Alert] {{ .GroupLabels.alertname }}'
        body: |
          Operations team alert:
          {{ range .Alerts }}
          {{ .Annotations.summary }} - {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  # Inhibit info alerts if critical alerts are firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'info'
    equal: ['alertname', 'cluster']

  # Inhibit warning alerts if critical alerts are firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster']

  # Inhibit all alerts if service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      service: '.*'
    equal: ['service']