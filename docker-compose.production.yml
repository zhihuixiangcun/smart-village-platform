# ============================================
# 智慧乡村综合服务平台 - 生产环境 Docker Compose 配置
# ============================================
# 使用方法:
#   1. 复制 .env.production.example 为 .env.production 并填入实际配置
#   2. 运行: docker-compose -f docker-compose.production.yml up -d
# ============================================

version: '3.8'

services:
  # ============================================
  # MongoDB 副本集配置 (生产环境推荐)
  # ============================================
  mongodb-primary:
    image: mongo:7.0
    container_name: smart-village-mongo-primary
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_REPLICA_SET_NAME: rs0
    volumes:
      - mongodb-primary-data:/data/db
      - mongodb-primary-config:/data/configdb
    command: mongod --replSet rs0 --bind_ip_all
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-village-network

  mongodb-secondary:
    image: mongo:7.0
    container_name: smart-village-mongo-secondary
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb-secondary-data:/data/db
      - mongodb-secondary-config:/data/configdb
    command: mongod --replSet rs0 --bind_ip_all
    depends_on:
      - mongodb-primary
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-village-network

  # ============================================
  # Redis 集群配置
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: smart-village-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - smart-village-network

  # ============================================
  # 主应用服务 (API Server - Port 3001)
  # ============================================
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-village-api-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - MAIN_PORT=3001
      - MONGO_URI=${MONGO_URI}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=${CLIENT_URL}
    env_file:
      - .env.production
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./config:/app/config
    depends_on:
      - mongodb-primary
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    networks:
      - smart-village-network

  # ============================================
  # 村务服务 (Village Service - Port 5000)
  # ============================================
  village-service:
    build:
      context: .
      dockerfile: Dockerfile.village
    container_name: smart-village-village-service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - VILLAGE_PORT=5000
      - MONGO_URI=${MONGO_URI}
      - CLIENT_URL=${CLIENT_URL}
    env_file:
      - .env.production
    volumes:
      - ./logs:/app/logs
    depends_on:
      - mongodb-primary
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - smart-village-network

  # ============================================
  # 监控服务
  # ============================================

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: smart-village-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - smart-village-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: smart-village-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - smart-village-network

# ============================================
# 数据卷定义
# ============================================
volumes:
  mongodb-primary-data:
    driver: local
  mongodb-primary-config:
    driver: local
  mongodb-secondary-data:
    driver: local
  mongodb-secondary-config:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# ============================================
# 网络定义
# ============================================
networks:
  smart-village-network:
    driver: bridge
