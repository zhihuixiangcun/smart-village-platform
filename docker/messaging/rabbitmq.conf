# RabbitMQ 配置文件
# 智慧乡村平台消息队列配置

# 基础配置
loopback_users.guest = false
listeners.tcp.default = 5672

# 管理插件端口
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# STOMP插件端口
stomp.tcp.port = 61613
stomp.tcp.ip = 0.0.0.0

# MQTT插件端口
mqtt.tcp.port = 1883
mqtt.tcp.ip = 0.0.0.0

# WebSocket插件端口
web_stomp.tcp.port = 15674
web_stomp.tcp.ip = 0.0.0.0

# 内存和磁盘限制
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# 心跳设置
heartbeat = 60

# 集群配置
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_gossip
cluster_formation.gossip_partition_handling = auto_heal

# 队列设置
default_vhost = smart-village
default_user_tags.administrator = true
default_user_tags.monitoring = true
default_user_tags.policymaker = true
default_user_tags.management = true

# 日志配置
log.file.level = info
log.console = true
log.console.level = info

# SSL配置（生产环境启用）
# listeners.ssl.default = 5671
# ssl_options.certfile = /etc/rabbitmq/ssl/server.pem
# ssl_options.keyfile = /etc/rabbitmq/ssl/server.key
# ssl_options.cacertfile = /etc/rabbitmq/ssl/ca.pem

# 性能优化
num_acceptors.tcp = 10
channel_max = 2047
heartbeat_timeout = 60

# 持久化配置
queue_master_locator=min-masters
ha_sync_mode = synced
ha_sync_batch_size = 4

# 流控制配置
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# 监控配置
collect_statistics_interval = 10000
collect_statistics = true