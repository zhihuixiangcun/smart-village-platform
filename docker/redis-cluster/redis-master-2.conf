# Redis Master Node 2 Configuration
# Smart Village Platform - Redis Cluster Configuration

# === Network Configuration ===
port 7002
bind 0.0.0.0
protected-mode yes
tcp-backlog 511
timeout 300
tcp-keepalive 300

# === General Configuration ===
daemonize no
supervised no
pidfile /var/run/redis-7002.pid
loglevel notice
logfile "/var/log/redis/redis-7002.log"
databases 16

# === Snapshotting (RDB) ===
save 3600 1
save 300 100
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump-master-2.rdb
dir /data

# === Replication ===
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-disable-tcp-nodelay no
replica-priority 100

# === Memory Management ===
maxmemory 4gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# === AOF ===
appendonly yes
appendfilename "appendonly-master-2.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# === Cluster Configuration ===
cluster-enabled yes
cluster-config-file nodes-master-2.conf
cluster-node-timeout 5000
cluster-replica-validity-factor 10
cluster-migration-barrier 1
cluster-require-full-coverage yes

# === Slow Log ===
slowlog-log-slower-than 10000
slowlog-max-len 128

# === Latency Monitor ===
latency-monitor-threshold 100

# === Advanced Config ===
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hz 10
dynamic-hz yes
