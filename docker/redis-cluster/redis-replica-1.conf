# Redis Replica Node 1 Configuration (Replica of Master 1)
# Smart Village Platform - Redis Cluster Configuration

port 7004
bind 0.0.0.0
protected-mode yes
daemonize no
pidfile /var/run/redis-7004.pid
loglevel notice
logfile "/var/log/redis/redis-7004.log"
databases 16
maxmemory 4gb
maxmemory-policy allkeys-lru
appendonly yes
appendfilename "appendonly-replica-1.aof"
dbfilename dump-replica-1.rdb
dir /data

# === Cluster Configuration ===
cluster-enabled yes
cluster-config-file nodes-replica-1.conf
cluster-node-timeout 5000
cluster-replica-validity-factor 10
cluster-migration-barrier 1
cluster-require-full-coverage yes

# === Performance ===
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100
hz 10
dynamic-hz yes
