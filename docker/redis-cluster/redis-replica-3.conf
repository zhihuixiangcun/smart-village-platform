# Redis Replica Node 3 Configuration (Replica of Master 3)
# Smart Village Platform - Redis Cluster Configuration

port 7006
bind 0.0.0.0
protected-mode yes
daemonize no
pidfile /var/run/redis-7006.pid
loglevel notice
logfile "/var/log/redis/redis-7006.log"
databases 16
maxmemory 4gb
maxmemory-policy allkeys-lru
appendonly yes
appendfilename "appendonly-replica-3.aof"
dbfilename dump-replica-3.rdb
dir /data

# === Cluster Configuration ===
cluster-enabled yes
cluster-config-file nodes-replica-3.conf
cluster-node-timeout 5000
cluster-replica-validity-factor 10
cluster-migration-barrier 1
cluster-require-full-coverage yes

# === Performance ===
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100
hz 10
dynamic-hz yes
