  name: client-green
  namespace: smart-village-prod
  labels:
    app: client
    environment: green
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: client
    environment: green

---
# Active Client Service
apiVersion: v1
kind: Service
metadata:
  name: client-active
  namespace: smart-village-prod
  labels:
    app: client
    role: active
spec:
