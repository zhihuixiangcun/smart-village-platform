    environment: blue  # Initially points to blue

---
# LoadBalancer Service for External Access
apiVersion: v1
kind: Service
metadata:
  name: smart-village-lb
  namespace: smart-village-prod
  labels:
    app: smart-village
    role: loadbalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 443
    targetPort: 8080
    protocol: TCP
    name: https
  selector:
    app: client
    environment: blue

---
# Headless Service for StatefulSet (if needed for databases)
apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
  namespace: smart-village-prod
  labels:
    app: mongodb
spec:
  clusterIP: None
  ports:
  - port: 27017
    targetPort: 27017
    name: mongodb
  selector:
    app: mongodb