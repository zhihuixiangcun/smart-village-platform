# Services for Blue-Green Deployment Strategy

# API Server Services
---
apiVersion: v1
kind: Service
metadata:
  name: api-server-blue
  namespace: smart-village-prod
  labels:
    app: api-server
    environment: blue
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
  - port: 3002
    targetPort: 3002
    protocol: TCP
    name: websocket
  selector:
    app: api-server
    environment: blue

---
apiVersion: v1
kind: Service
metadata:
  name: api-server-green
  namespace: smart-village-prod
  labels:
    app: api-server
    environment: green
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
  - port: 3002
    targetPort: 3002
    protocol: TCP
    name: websocket
  selector:
    app: api-server
    environment: green

---
# Active API Server Service (switches between blue/green)
apiVersion: v1
kind: Service
metadata:
  name: api-server-active
  namespace: smart-village-prod
  labels:
    app: api-server
    role: active
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
  - port: 3002
    targetPort: 3002
    protocol: TCP
    name: websocket
  selector:
    app: api-server
    environment: blue  # Initially points to blue

