# 智慧乡村系统密钥
apiVersion: v1
kind: Secret
metadata:
  name: smartvillage-secrets
  namespace: smartvillage
  labels:
    app: smartvillage
    component: secrets
type: Opaque
data:
  # JWT密钥 (Base64编码)
  JWT_SECRET: <base64-encoded-jwt-secret>

  # MongoDB凭据 (Base64编码)
  MONGO_ROOT_USERNAME: <base64-encoded-mongo-username>
  MONGO_ROOT_PASSWORD: <base64-encoded-mongo-password>
  MONGO_URI: <base64-encoded-mongo-uri>

  # Redis凭据 (Base64编码)
  REDIS_PASSWORD: <base64-encoded-redis-password>
  REDIS_URL: <base64-encoded-redis-url>

  # 外部服务API密钥 (Base64编码)
  BAIDU_TTS_KEY: <base64-encoded-baidu-tts-key>
  BAIDU_TTS_SECRET: <base64-encoded-baidu-tts-secret>
  TENCENT_OCR_SECRET_ID: <base64-encoded-tencent-ocr-id>
  TENCENT_OCR_SECRET_KEY: <base64-encoded-tencent-ocr-key>

  # 邮件服务配置 (Base64编码)
  SMTP_HOST: <base64-encoded-smtp-host>
  SMTP_USER: <base64-encoded-smtp-user>
  SMTP_PASS: <base64-encoded-smtp-password>

  # 短信服务配置 (Base64编码)
  SMS_ACCESS_KEY: <base64-encoded-sms-access-key>
  SMS_SECRET_KEY: <base64-encoded-sms-secret-key>

  # 加密密钥 (Base64编码)
  ENCRYPTION_KEY: <base64-encoded-encryption-key>
  HASH_SALT: <base64-encoded-hash-salt>