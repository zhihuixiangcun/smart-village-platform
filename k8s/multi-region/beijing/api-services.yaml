# Beijing Region - API Microservices Deployment
# 华北区 - API 微服务部署
#
# Services deployed:
# - User Service (port 3001)
# - Resident Service (port 3002)
# - Village Service (port 3003)
# - Finance Service (port 3004)
# - Agritech Service (port 3010)
# - Farm Product Service (port 3011)
# - Agri-Tech Service (port 3012)
# - Agri-Finance Service (port 3013)
# - Subscription Service (port 3020)
# - Tenant Service (port 3021)
# - Data Sync Service (port 3022)
# - Standard Service (port 3023)
#
# Region: Beijing (cn-north-1)
# Role: Primary API Region

---
# API Gateway Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: smart-village
  labels:
    app: api-gateway
    region: beijing
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        region: beijing
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - api-gateway
              topologyKey: kubernetes.io/hostname
      containers:
      - name: api-gateway
        image: smart-village/api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: REGION_CODE
          value: "cn-north-1"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: smart-village-secrets
              key: MONGO_URI
        - name: REDIS_CLUSTER_NODES
          valueFrom:
            configMapKeyRef:
              name: smart-village-config
              key: REDIS_CLUSTER_NODES
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: smart-village-secrets
              key: JWT_SECRET
        - name: MULTI_TENANT_ENABLED
          value: "true"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

