---
# Mongos Router
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-mongos
  namespace: smart-village
  labels:
    app: mongodb
    component: mongos
    region: beijing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mongodb
      component: mongos
  template:
    metadata:
      labels:
        app: mongodb
        component: mongos
        region: beijing
    spec:
      containers:
      - name: mongos
        image: mongo:6.0
        command:
        - mongos
        - --configdb
        - config-server-rs/mongodb-config-server-0.mongodb-config-server:27019,mongodb-config-server-1.mongodb-config-server:27019,mongodb-config-server-2.mongodb-config-server:27019
        - --bind_ip_all
        - --port
        - "27017"
        ports:
        - containerPort: 27017
          name: mongodb
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"

---
# MongoDB Shards Services
apiVersion: v1
kind: Service
metadata:
  name: mongodb-config-server
  namespace: smart-village
  labels:
    app: mongodb
    component: config-server
spec:
  clusterIP: None
  ports:
  - port: 27019
    targetPort: 27019
  selector:
    app: mongodb
    component: config-server

