# Namespace for Smart Village Platform
apiVersion: v1
kind: Namespace
metadata:
  name: smart-village-prod
  labels:
    name: smart-village-prod
    environment: production
    app: smart-village
  annotations:
    description: "Production namespace for Smart Village Platform"
    contact: "team@smartvillage.com"
---
# Resource Quotas for Production
apiVersion: v1
kind: ResourceQuota
metadata:
  name: smart-village-quota
  namespace: smart-village-prod
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
    services: "10"
    persistentvolumeclaims: "10"
    secrets: "20"
    configmaps: "20"
---
# Network Policy for Production
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smart-village-network-policy
  namespace: smart-village-prod
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: smart-village-prod
    - namespaceSelector:
        matchLabels:
          name: istio-system
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          name: smart-village-prod