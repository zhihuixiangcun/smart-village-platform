# 智慧乡村系统入口配置
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartvillage-ingress
  namespace: smartvillage
  labels:
    app: smartvillage
    component: ingress
  annotations:
    # Nginx Ingress配置
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # 压缩配置
    nginx.ingress.kubernetes.io/enable-modsecurity: "false"
    nginx.ingress.kubernetes.io/enable-owasp-modsecurity-crs: "false"
    nginx.ingress.kubernetes.io/enable-opentracing: "false"

    # 限流配置
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"

    # CORS配置
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"

    # 代理配置
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"

    # 缓存配置
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws: wss:; media-src 'self'; object-src 'none'; frame-ancestors 'none';";

    # WebSocket支持
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/send-timeout: "3600"

    # 会话亲和性
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "smartvillage-session"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"

    # JWT认证（可选）
    # nginx.ingress.kubernetes.io/auth-url: "https://auth.example.com/validate"
    # nginx.ingress.kubernetes.io/auth-signin: "https://auth.example.com/signin"
spec:
  tls:
  - hosts:
    - smartvillage.example.com
    - api.smartvillage.example.com
    secretName: smartvillage-tls
  rules:
  # 前端
  - host: smartvillage.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000

  # API服务
  - host: api.smartvillage.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 3001

      # WebSocket路径
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: village-service
            port:
              number: 5000

---
# 生产环境API入口（可选）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartvillage-api-ingress
  namespace: smartvillage
  labels:
    app: smartvillage
    component: api-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "200"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/rate-limit-connections: "50"
spec:
  tls:
  - hosts:
    - api.smartvillage.example.com
    secretName: smartvillage-api-tls
  rules:
  - host: api.smartvillage.example.com
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 3001