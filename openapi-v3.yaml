openapi: 3.0.3
info:
  title: 智慧乡村综合服务平台 API
  description: |
    智慧乡村综合服务平台API文档

    本平台提供村庄治理、村民服务、电子商务、应急响应等全方位数字化服务。

    主要功能模块：
    - 村民管理：村民档案、家庭关系、证件管理
    - 村务治理：公告发布、会议管理、任务调度、财务管理
    - 应急响应：事件上报、资源调度、预案管理
    - 电子商务：农产品交易、订单管理、支付集成
    - AI智能：语音识别、人脸识别、OCR识别、智能问答

    特色功能：
    - 支持22种方言交互
    - 人脸识别登录
    - OCR发票识别
    - 离线数据同步
  version: 2.0.0
  contact:
    name: 智慧乡村开发团队
    email: dev@smartvillage.com
    url: https://smartvillage.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://api.smartvillage.com/v1
    description: 生产环境
  - url: https://staging-api.smartvillage.com/v1
    description: 测试环境
  - url: http://localhost:3001/v1
    description: 开发环境
tags:
  - name: 认证授权
    description: 用户认证和授权管理
  - name: 村民管理
    description: 村民档案和家庭管理
  - name: 村务治理
    description: 村务公告、会议、任务管理
  - name: 财务管理
    description: 村级财务收支管理
  - name: 应急响应
    description: 应急事件和资源管理
  - name: 电子商务
    description: 农产品和订单管理
  - name: 支付服务
    description: 支付相关接口
  - name: AI智能
    description: 人工智能服务接口
  - name: 系统管理
    description: 系统配置和管理
paths:
  # ========== 认证授权模块 ==========
  /auth/login:
    post:
      tags:
        - 认证授权
      summary: 用户登录
      description: |
        支持多种登录方式：
        - 密码登录
        - 人脸识别登录
        - 语音识别登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - loginType
              properties:
                loginType:
                  type: string
                  enum: [password, face, voice, qr]
                  description: 登录类型
                username:
                  type: string
                  description: 用户名（密码登录时必填）
                password:
                  type: string
                  format: password
                  description: 密码（密码登录时必填）
                faceImage:
                  type: string
                  format: base64
                  description: 人脸图片base64（人脸登录时必填）
                voiceData:
                  type: string
                  description: 语音数据（语音登录时必填）
                dialect:
                  type: string
                  description: 方言代码（语音登录时必填）
                captcha:
                  type: string
                  description: 验证码
                villageId:
                  type: string
                  description: 村庄ID（可选，用于快速登录）
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []

  /auth/refresh:
    post:
      tags:
        - 认证授权
      summary: 刷新访问令牌
      description: 使用刷新令牌获取新的访问令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: 刷新令牌
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security: []

  /auth/logout:
    post:
      tags:
        - 认证授权
      summary: 用户登出
      description: 注销当前用户的登录状态
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - bearerAuth: []

  /auth/register:
    post:
      tags:
        - 认证授权
      summary: 用户注册
      description: 村民用户注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      security: []

  # ========== 村民管理模块 ==========
  /villages/{villageId}/residents:
    get:
      tags:
        - 村民管理
      summary: 获取村民列表
      description: 分页获取村庄村民列表，支持搜索和筛选
      parameters:
        - name: villageId
          in: path
          required: true
          schema:
            type: string
          description: 村庄ID
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 页码
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 每页数量
        - name: search
          in: query
          schema:
            type: string
          description: 搜索关键词（姓名、身份证号、手机号）
        - name: familyType
          in: query
          schema:
            type: string
            enum: [low_income, one_child, elderly, disabled]
          description: 家庭类型筛选
        - name: ageGroup
          in: query
          schema:
            type: string
            enum: [children, youth, middle_aged, elderly]
          description: 年龄组筛选
        - name: gender
          in: query
          schema:
            type: string
            enum: [male, female]
          description: 性别筛选
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Resident'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []

    post:
      tags:
        - 村民管理
      summary: 创建村民档案
      description: 新增村民档案信息
      parameters:
        - name: villageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResidentCreate'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Resident'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - bearerAuth: []

  /residents/{residentId}:
    get:
      tags:
        - 村民管理
      summary: 获取村民详情
      parameters:
        - name: residentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ResidentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []

    put:
      tags:
        - 村民管理
      summary: 更新村民信息
      parameters:
        - name: residentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResidentUpdate'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Resident'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []

  /residents/ocr-scan:
    post:
      tags:
        - 村民管理
      summary: OCR识别身份证
      description: 通过OCR技术自动识别身份证信息
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - idCardImage
              properties:
                idCardImage:
                  type: string
                  format: binary
                  description: 身份证图片文件
                faceImage:
                  type: string
                  format: binary
                  description: 人脸照片文件（可选）
      responses:
        '200':
          description: 识别成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      extractedInfo:
                        type: object
                        properties:
                          name:
                            type: string
                            example: "张三"
                          idNumber:
                            type: string
                            example: "330106196001011234"
                          gender:
                            type: string
                            enum: [male, female]
                            example: "male"
                          birthDate:
                            type: string
                            format: date
                            example: "1960-01-01"
                          address:
                            type: string
                            example: "浙江省杭州市余杭区XX街道XX村"
                          nation:
                            type: string
                            example: "汉"
                          issuingAuthority:
                            type: string
                            example: "杭州市公安局余杭分局"
                          validDate:
                            type: string
                            example: "2020.01.01-2030.01.01"
                      confidence:
                        type: number
                        format: float
                        minimum: 0
                        maximum: 1
                        example: 0.98
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
        - bearerAuth: []

  # ========== 村务治理模块 ==========
  /villages/{villageId}/announcements:
    get:
      tags:
        - 村务治理
      summary: 获取公告列表
      parameters:
        - name: villageId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: type
          in: query
          schema:
            type: string
            enum: [notice, policy, emergency, activity]
        - name: priority
          in: query
          schema:
            type: string
            enum: [normal, important, urgent]
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Announcement'
      security:
        - bearerAuth: []

    post:
      tags:
        - 村务治理
      summary: 发布公告
      parameters:
        - name: villageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementCreate'
      responses:
        '201':
          description: 发布成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Announcement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - bearerAuth: []

  /announcements/{announcementId}:
    get:
      tags:
        - 村务治理
      summary: 获取公告详情
      parameters:
        - name: announcementId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AnnouncementDetail'
      security:
        - bearerAuth: []

    put:
      tags:
        - 村务治理
      summary: 更新公告
      parameters:
        - name: announcementId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementUpdate'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Announcement'
      security:
        - bearerAuth: []

    delete:
      tags:
        - 村务治理
      summary: 删除公告
      parameters:
        - name: announcementId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []

  /announcements/{announcementId}/interact:
    post:
      tags:
        - 村务治理
      summary: 公告互动
      description: 点赞、分享、查看等互动操作
      parameters:
        - name: announcementId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [view, like, unlike, share]
                  description: 互动类型
                comment:
                  type: string
                  description: 评论内容（分享时可填写）
      responses:
        '200':
          description: 操作成功
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
        - bearerAuth: []

  /villages/{villageId}/tasks:
    get:
      tags:
        - 村务治理
      summary: 获取任务列表
      parameters:
        - name: villageId
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, assigned, in_progress, completed, cancelled]
        - name: type
          in: query
          schema:
            type: string
            enum: [patrol, emergency, maintenance, event]
        - name: assigneeId
          in: query
          schema:
            type: string
            description: 负责人ID
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, urgent]
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
      security:
        - bearerAuth: []

    post:
      tags:
        - 村务治理
      summary: 创建任务
      parameters:
        - name: villageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Task'
      security:
        - bearerAuth: []

  /tasks/{taskId}/status:
    put:
      tags:
        - 村务治理
      summary: 更新任务状态
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, assigned, in_progress, completed, cancelled]
                report:
                  type: object
                  properties:
                    notes:
                      type: string
                    photos:
                      type: array
                      items:
                        type: string
                    issues:
                      type: array
                      items:
                        type: object
                        properties:
                          description:
                            type: string
                          severity:
                            type: string
                            enum: [low, medium, high]
                          photos:
                            type: array
                            items:
                              type: string
      responses:
        '200':
          description: 更新成功
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
        - bearerAuth: []

  # ========== 财务管理模块 ==========
  /villages/{villageId}/finance/records:
    get:
      tags:
        - 财务管理
      summary: 获取财务记录
      parameters:
        - name: villageId
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [income, expense]
        - name: category
          in: query
          schema:
            type: string
            description: 财务分类
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FinanceRecord'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - bearerAuth: []

    post:
      tags:
        - 财务管理
      summary: 创建财务记录
      parameters:
        - name: villageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceRecordCreate'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/FinanceRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
        - bearerAuth: []

  /villages/{villageId}/finance/reports:
    get:
      tags:
        - 财务管理
      summary: 获取财务报表
      description: 生成月度、年度财务报表
      parameters:
        - name: villageId
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [monthly, yearly]
          description: 报表类型
        - name: year
          in: query
          required: true
          schema:
            type: integer
          description: 年份
        - name: month
          in: query
          schema:
            type: integer
          description: 月份（月度报表时必填）
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/FinanceReport'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
        - bearerAuth: []

  /finance/ocr-receipt:
    post:
      tags:
        - 财务管理
      summary: OCR识别票据
      description: 自动识别发票、收据等票据信息
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - receiptImage
              properties:
                receiptImage:
                  type: string
                  format: binary
                  description: 票据图片文件
                type:
                  type: string
                  enum: [invoice, receipt, bank_slip]
                  default: receipt
                  description: 票据类型
      responses:
        '200':
          description: 识别成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      vendor:
                        type: string
                        example: "XX办公用品有限公司"
                      amount:
                        type: number
                        format: float
                        example: 128.50
                      date:
                        type: string
                        format: date
                        example: "2025-12-20"
                      invoiceNumber:
                        type: string
                        example: "20251220001"
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            quantity:
                              type: number
                            unitPrice:
                              type: number
                            total:
                              type: number
                      confidence:
                        type: number
                        format: float
                        minimum: 0
                        maximum: 1
                        example: 0.92
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
        - bearerAuth: []

  # ========== 应急响应模块 ==========
  /villages/{villageId}/emergency/reports:
    post:
      tags:
        - 应急响应
      summary: 上报应急事件
      parameters:
        - name: villageId
          in: path
          required: true
          schema:
