  # ========== AI智能服务模块 ==========
  /ai/speech/recognize:
    post:
      tags:
        - AI智能
      summary: 语音识别
      description: 支持多种方言的语音转文字
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - audio
              properties:
                audio:
                  type: string
                  format: binary
                  description: 音频文件
                dialect:
                  type: string
                  description: 方言代码
                context:
                  type: string
                  description: 上下文提示
      responses:
        '200':
          description: 识别成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      text:
                        type: string
                        example: "我想查询今天的天气"
                      confidence:
                        type: number
                        format: float
                        example: 0.95
                      alternatives:
                        type: array
                        items:
                          type: string
                      language:
                        type: string
                        example: "zh-CN"
                      dialect:
                        type: string
                        example: "pcc-qn"
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
        - bearerAuth: []

  /ai/speech/synthesize:
    post:
      tags:
        - AI智能
      summary: 语音合成
      description: 文字转语音，支持多种方言和音色
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  description: 要合成的文本
                dialect:
                  type: string
                  default: "pcc"
                  description: 方言代码
                voice:
                  type: string
                  enum: [male, female, elderly, child]
                  default: "female"
                  description: 音色
                speed:
                  type: number
                  format: float
                  minimum: 0.5
                  maximum: 2.0
                  default: 1.0
                  description: 语速
                pitch:
                  type: number
                  format: float
                  minimum: 0.5
                  maximum: 2.0
                  default: 1.0
                  description: 音调
      responses:
        '200':
          description: 合成成功
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
        - bearerAuth: []

  /ai/face/recognize:
    post:
      tags:
        - AI智能
      summary: 人脸识别
      description: 人脸特征提取和比对
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - faceImage
              properties:
                faceImage:
                  type: string
                  format: binary
                  description: 人脸图片
                villageId:
                  type: string
                  description: 村庄ID（用于限定搜索范围）
      responses:
        '200':
          description: 识别成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      matched:
                        type: boolean
                        example: true
                      userId:
                        type: string
                        example: "60f7b3b3b3b3b3b3b3b3b3b3"
                      confidence:
                        type: number
                        format: float
                        example: 0.98
                      features:
                        type: object
                        properties:
                          age:
                            type: integer
                            example: 45
                          gender:
                            type: string
                            enum: [male, female]
                            example: "male"
                          emotion:
                            type: string
                            enum: [happy, sad, angry, neutral]
                            example: "neutral"
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
        - bearerAuth: []

  /ai/chat:
    post:
      tags:
        - AI智能
      summary: 智能问答
      description: AI智能对话服务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: 用户问题
                context:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                dialect:
                  type: string
                  description: 方言代码
                userId:
                  type: string
                  description: 用户ID
      responses:
        '200':
          description: 回复成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      reply:
                        type: string
                        example: "今天天气晴朗，气温15-25度"
                      intent:
                        type: string
                        example: "weather_query"
                      entities:
                        type: object
                      actions:
                        type: array
                        items:
                          type: object
                      suggestions:
                        type: array
                        items:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
        - bearerAuth: []

  /ai/smart-form:
    post:
      tags:
        - AI智能
      summary: 智能填表
      description: 根据语音或文字自动填写表单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - templateId
                - input
              properties:
                templateId:
                  type: string
                  description: 表单模板ID
                input:
                  type: string
                  description: 输入内容（语音识别后的文字）
                inputType:
                  type: string
                  enum: [text, voice]
                  default: "text"
      responses:
        '200':
          description: 填表成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      formData:
                        type: object
                        description: 填充后的表单数据
                      confidence:
                        type: number
                        format: float
                        description: 置信度
                      suggestions:
                        type: array
                        items:
                          type: object

# ========== 组件定义 ==========
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT认证令牌

  schemas:
    # 通用响应结构
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        code:
          type: integer
          example: 200
        message:
          type: string
          example: "操作成功"
        data:
          type: object
        meta:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        code:
          type: integer
          example: 400
        message:
          type: string
          example: "请求参数错误"
        error:
          type: object
          properties:
            type:
              type: string
            details:
              type: array
              items:
                type: object
        meta:
          type: object

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 5

    # 认证相关
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            token:
              type: string
              example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            refreshToken:
              type: string
            expiresIn:
              type: integer
              example: 3600
            user:
              $ref: '#/components/schemas/User'

    TokenRefreshResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            token:
              type: string
            expiresIn:
              type: integer
              example: 3600

    User:
      type: object
      properties:
        id:
          type: string
          example: "60f7b3b3b3b3b3b3b3b3b3b3"
        username:
          type: string
          example: "zhangsan"
        name:
          type: string
          example: "张三"
        phone:
          type: string
          example: "138****5678"
        email:
          type: string
          example: "zhangsan@example.com"
        avatar:
          type: string
          example: "https://cdn.example.com/avatar.jpg"
        role:
          type: string
          enum: [admin, committee, villager]
          example: "villager"
        villageId:
          type: string
          example: "60f7b3b3b3b3b3b3b3b3b3b3"
        permissions:
          type: array
          items:
            type: string
        preferences:
          type: object
          properties:
            dialect:
              type: string
              example: "pcc-qn"
            largeTextMode:
              type: boolean
              example: false
            voiceNotification:
              type: boolean
              example: true
        lastLoginAt:
          type: string
          format: date-time

    UserRegistration:
      type: object
      required:
        - username
        - password
        - name
        - phone
        - idNumber
        - villageId
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          example: "zhangsan123"
        password:
          type: string
          format: password
          minLength: 8
          example: "password123"
        name:
          type: string
          example: "张三"
        phone:
          type: string
          pattern: "^1[3-9]\\d{9}$"
          example: "13812345678"
        email:
          type: string
          format: email
          example: "zhangsan@example.com"
        idNumber:
          type: string
          pattern: "^\\d{17}[\\dX]$"
          example: "330106196001011234"
        gender:
          type: string
          enum: [male, female]
          example: "male"
        birthDate:
          type: string
          format: date
          example: "1960-01-01"
        address:
          type: string
          example: "浙江省杭州市余杭区XX村"
        familyId:
          type: string
          example: "60f7b3b3b3b3b3b3b3b3b3b3"
        familyRole:
          type: string
          enum: [holder, spouse, child, parent]
          example: "holder"

    # 村民管理
    Resident:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: "张三"
        idNumber:
          type: string
          example: "3301********1234"
        gender:
          type: string
          enum: [male, female]
        birthDate:
          type: string
          format: date
        age:
          type: integer
        phone:
          type: string
          example: "138****5678"
        address:
          type: string
        familyId:
          type: string
        familyRole:
          type: string
          enum: [holder, spouse, child, parent]
        education:
          type: string
        occupation:
          type: string
        healthStatus:
          type: string
          enum: [healthy, chronic_disease, disability]
        specialTags:
          type: array
          items:
            type: string
        avatar:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ResidentDetail:
      allOf:
        - $ref: '#/components/schemas/Resident'
        - type: object
          properties:
            familyInfo:
              type: object
              properties:
                familyCode:
                  type: string
                holderName:
                  type: string
                memberCount:
                  type: integer
                address:
                  type: string
                houseType:
                  type: string
                area:
                  type: number
            certificates:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                  number:
                    type: string
                  issueDate:
                    type: string
                  expiryDate:
                    type: string
                  imageUrl:
                    type: string
            subsidies:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                  amount:
                    type: number
                  date:
                    type: string

    ResidentCreate:
      type: object
      required:
        - name
        - idNumber
        - gender
        - birthDate
        - phone
        - address
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        idNumber:
          type: string
          pattern: "^\\d{17}[\\dX]$"
        gender:
          type: string
          enum: [male, female]
        birthDate:
          type: string
          format: date
        phone:
          type: string
          pattern: "^1[3-9]\\d{9}$"
        email:
          type: string
          format: email
        address:
          type: string
        familyId:
          type: string
        familyRole:
          type: string
          enum: [holder, spouse, child, parent]
        education:
          type: string
          enum: [primary, junior, senior, college, bachelor, master, doctor]
        occupation:
          type: string
        healthStatus:
          type: string
          enum: [healthy, chronic_disease, disability]
        specialTags:
          type: array
          items:
            type: string
            enum: [low_income, one_child, elderly, disabled, veteran]

    ResidentUpdate:
      type: object
      properties:
        phone:
          type: string
          pattern: "^1[3-9]\\d{9}$"
        email:
          type: string
          format: email
        address:
          type: string
        education:
          type: string
        occupation:
          type: string
        healthStatus:
          type: string
        specialTags:
          type: array
          items:
            type: string

    # 村务治理
    Announcement:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        type:
          type: string
          enum: [notice, policy, emergency, activity]
        priority:
          type: string
          enum: [normal, important, urgent]
        publisher:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            role:
              type: string
        publishDate:
          type: string
          format: date-time
        expiryDate:
          type: string
          format: date-time
